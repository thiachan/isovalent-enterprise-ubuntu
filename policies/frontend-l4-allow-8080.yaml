# Basic L3/4: allow frontend ingress only on TCP 8080 (deny all other ports).
# NOTE: This unions with an L7 policy and OVERRIDES L7 method filtering
# (a plain L4 allow-all on 8080 means all HTTP methods pass). Keep this
# OUT if you want the L7 DELETE->403 enforcement from frontend-l7-http.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frontend-l4-allow-8080
  namespace: online-boutique
spec:
  description: "Basic L3/4: allow frontend ingress only on TCP 8080 (deny all other ports)"
  endpointSelector:
    matchLabels:
      app: frontend
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
