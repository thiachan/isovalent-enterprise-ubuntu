# Cloud metadata guardrail (cluster-wide). Blocks all online-boutique pods from
# reaching the cloud instance metadata endpoint 169.254.169.254 (SSRF / cloud
# credential theft protection - cf. 2019 Capital One breach).
#
# IMPORTANT: enableDefaultDeny.egress=false makes this a PURE ADDITIVE DENY.
# Without it, an egressDeny rule flips selected pods into default-deny egress,
# which drops their DNS to kube-dns (10.96.0.10) and breaks the app
# ("Temporary failure in name resolution" / gRPC lookup timeouts).
#
# Note: this is cluster-scoped (no namespace). In the Timescape Policies view,
# set Namespace = All namespaces to see it (a namespace filter hides it).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: block-cloud-metadata
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: online-boutique
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
